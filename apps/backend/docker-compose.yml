services:
  # FastAPI inference server
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sapisehat-backend
    ports:
      - "8000:8000"
    environment:
      - FASTAPI_ENV=development
      - DEBUG=true
      - DEVICE=cpu
      - LOG_LEVEL=info
      - PYTHONUNBUFFERED=1
      - MODEL_PATH=./model/tes1_best.keras
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=sapisehat-scan-images
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_FORCE_PATH_STYLE=true
      - MEDIA_MAX_UPLOAD_BYTES=10485760
    volumes:
      - .:/app
      - /app/__pycache__
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --reload
    networks:
      - sapisehat-network
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: sapisehat-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    networks:
      - sapisehat-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: sapisehat-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/sapisehat-scan-images
      "
    networks:
      - sapisehat-network

networks:
  sapisehat-network:
    driver: bridge

volumes:
  logs:
    driver: local
  minio-data:
    driver: local
